spring.application.name=MyUiRestDbService
server.port=8080
spring.datasource.url=jdbc:h2:file:./testdb/students;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
management.endpoints.web.exposure.include=health,info,metrics,mappings,beans
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=MyUiRestDbService
info.app.description=Laboratory 8 - Students and study groups
info.app.version=1.0
server.address=127.0.0.1
