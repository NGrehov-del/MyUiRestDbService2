<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Список студентов</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/style.css}" rel="stylesheet"></head><body><main class="container"><nav th:replace="~{fragments/navigation :: navigation}"></nav><h3>Список студентов</h3><hr><p class="notice" th:if="${message}" th:text="${message}"></p><a class="btn btn-primary" th:href="@{/addStudentForm}">Добавить студента</a><div class="table-wrap"><table class="table table-bordered table-striped"><thead><tr><th>Имя</th><th>Фамилия</th><th>Факультет</th><th>Возраст</th><th>Действия</th></tr></thead><tbody><tr th:each="student : ${students}"><td th:text="${student.name}"></td><td th:text="${student.surname}"></td><td th:text="${student.faculty}"></td><td th:text="${student.age}"></td><td class="actions"><a class="btn btn-info" th:href="@{/showUpdateForm(studentId=${student.id})}">Изменить</a><form th:action="@{/deleteStudent}" method="post"><input type="hidden" name="studentId" th:value="${student.id}"><button class="btn btn-danger" type="submit">Удалить</button></form></td></tr><tr th:if="${#lists.isEmpty(students)}"><td colspan="5">Записей пока нет. Добавьте первую запись.</td></tr></tbody></table></div></main></body></html>
