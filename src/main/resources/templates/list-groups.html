<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Учебные группы</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/style.css}" rel="stylesheet"></head><body><main class="container"><nav th:replace="~{fragments/navigation :: navigation}"></nav><h3>Учебные группы</h3><hr><p class="notice" th:if="${message}" th:text="${message}"></p><a class="btn btn-primary" th:href="@{/addGroupForm}">Добавить группу</a><div class="table-wrap"><table class="table table-bordered table-striped"><thead><tr><th>Название группы</th><th>Факультет</th><th>Куратор</th><th>Курс</th><th>Действия</th></tr></thead><tbody><tr th:each="group : ${groups}"><td th:text="${group.name}"></td><td th:text="${group.faculty}"></td><td th:text="${group.curator}"></td><td th:text="${group.course}"></td><td class="actions"><a class="btn btn-info" th:href="@{/showGroupUpdateForm(groupId=${group.id})}">Изменить</a><form th:action="@{/deleteGroup}" method="post"><input type="hidden" name="groupId" th:value="${group.id}"><button class="btn btn-danger" type="submit">Удалить</button></form></td></tr><tr th:if="${#lists.isEmpty(groups)}"><td colspan="5">Записей пока нет. Добавьте первую запись.</td></tr></tbody></table></div></main></body></html>
