<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Регистрация</title><link th:href="@{/style.css}" rel="stylesheet"></head><body><main class="container"><nav th:replace="~{fragments/navigation :: navigation}"></nav><h2>Регистрация</h2><p class="notice" th:if="${param.success}">Регистрация завершена. Теперь можно войти.</p><form class="edit-form" th:action="@{/register/save}" th:object="${user}" method="post"><div class="field"><label for="firstName">Имя</label><input class="form-control" type="text" th:field="*{firstName}" maxlength="100" required><p class="field-error" th:errors="*{firstName}"></p></div><div class="field"><label for="lastName">Фамилия</label><input class="form-control" type="text" th:field="*{lastName}" maxlength="100" required><p class="field-error" th:errors="*{lastName}"></p></div><div class="field"><label for="email">Email</label><input class="form-control" type="email" th:field="*{email}" maxlength="254" required><p class="field-error" th:errors="*{email}"></p></div><div class="field"><label for="password">Пароль</label><input class="form-control" type="password" name="password" id="password" autocomplete="new-password" minlength="6" maxlength="72" required><p class="field-error" th:errors="*{password}"></p></div><button class="btn btn-primary" type="submit">Зарегистрироваться</button></form><p>Уже зарегистрированы? <a th:href="@{/login}">Войти</a></p></main></body></html>
