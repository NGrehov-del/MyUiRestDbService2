<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Добавить группу</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/style.css}" rel="stylesheet"></head><body><main class="container"><nav th:replace="~{fragments/navigation :: navigation}"></nav><h3>Добавить группу или редактирование</h3><hr><form class="edit-form" th:action="@{/saveGroup}" th:object="${group}" method="post"><input type="hidden" th:field="*{id}"><div class="field"><label for="name">Название группы</label><input class="form-control" type="text" th:field="*{name}" maxlength="30" required><p class="field-error" th:errors="*{name}"></p></div><div class="field"><label for="faculty">Факультет</label><input class="form-control" type="text" th:field="*{faculty}" maxlength="50" required><p class="field-error" th:errors="*{faculty}"></p></div><div class="field"><label for="curator">Куратор</label><input class="form-control" type="text" th:field="*{curator}" maxlength="100" required><p class="field-error" th:errors="*{curator}"></p></div><div class="field"><label for="course">Курс</label><input class="form-control" type="number" th:field="*{course}" min="1" max="6" required><p class="field-error" th:errors="*{course}"></p></div><button class="btn btn-primary" type="submit">Сохранить</button> <a class="btn" th:href="@{/groups}">Отмена</a></form><hr><a th:href="@{/groups}">Вернуться к списку</a></main></body></html>
