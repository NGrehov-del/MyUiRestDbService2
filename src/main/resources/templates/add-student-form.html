<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Добавить студента</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/style.css}" rel="stylesheet"></head><body><main class="container"><nav th:replace="~{fragments/navigation :: navigation}"></nav><h3>Добавить студента или редактирование</h3><hr><form class="edit-form" th:action="@{/saveStudent}" th:object="${student}" method="post"><input type="hidden" th:field="*{id}"><div class="field"><label for="name">Имя</label><input class="form-control" type="text" th:field="*{name}" maxlength="15" required><p class="field-error" th:errors="*{name}"></p></div><div class="field"><label for="surname">Фамилия</label><input class="form-control" type="text" th:field="*{surname}" maxlength="25" required><p class="field-error" th:errors="*{surname}"></p></div><div class="field"><label for="faculty">Факультет</label><input class="form-control" type="text" th:field="*{faculty}" maxlength="20" required><p class="field-error" th:errors="*{faculty}"></p></div><div class="field"><label for="age">Возраст</label><input class="form-control" type="number" th:field="*{age}" min="0" max="150" required><p class="field-error" th:errors="*{age}"></p></div><button class="btn btn-primary" type="submit">Сохранить</button> <a class="btn" th:href="@{/list}">Отмена</a></form><hr><a th:href="@{/list}">Вернуться к списку</a></main></body></html>
