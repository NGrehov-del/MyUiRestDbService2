<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Вход</title><link th:href="@{/style.css}" rel="stylesheet"></head><body><main class="container"><nav th:replace="~{fragments/navigation :: navigation}"></nav><h2>Вход</h2><p class="field-error" th:if="${param.error}">Неверный email или пароль</p>
<p class="notice" th:if="${param.logout}">Вы вышли из системы</p>
<form class="edit-form" th:action="@{/login}" method="post">
 <div class="field"><label for="email">Email</label><input class="form-control" type="email" id="email" name="email" autocomplete="username" required></div>
 <div class="field"><label for="password">Пароль</label><input class="form-control" type="password" id="password" name="password" autocomplete="current-password" required></div>
 <button class="btn btn-primary" type="submit">Войти</button>
</form><p>Нет учётной записи? <a th:href="@{/register}">Регистрация</a></p></main></body></html>
